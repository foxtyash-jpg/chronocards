const okp=x=>x.thumbnail&&!(x.pageprops&&'disambiguation' in x.pageprops),wq=t=>fetch(WP+t).then(r=>r.json()).then(j=>Object.values((j.query||{}).pages||{}));
async function findImg(c){const n=AL[c.n]||c.n;let p=(await wq('&titles='+encodeURIComponent(n))).find(okp);if(!p)p=(await wq('&generator=search&gsrlimit=6&gsrsearch='+encodeURIComponent(n))).sort((a,b)=>a.index-b.index).find(okp);return p?{u:p.thumbnail.source,t:p.title}:''}
const sp=(el,v)=>{if(!v||!v.u)return;const i=new Image();i.onload=()=>{el.style.backgroundImage=`url("${v.u}")`;el.classList.add('pi')};i.src=v.u};
const PQ=[],PE=new Set();let pa=0;
function pump(){while(pa<4&&PQ.length){const id=PQ.shift();pa++;findImg(CARDS[id]).then(v=>{IM[id]=v;try{localStorage.cc2_im=JSON.stringify(IM)}catch(e){}document.querySelectorAll('.ar[data-i="'+id+'"]').forEach(e=>sp(e,v))}).catch(()=>PE.delete(id)).finally(()=>{pa--;pump()})}}
function ph(el){const id=el.dataset.i;if(IM[id]!==undefined)return sp(el,IM[id]);if(PE.has(id))return;PE.add(id);PQ.push(id);pump()}
const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);ph(e.target)}}),{rootMargin:'250px'}):null;
function ob(){if(S.ph)document.querySelectorAll('.ar[data-i]:not(.pi)').forEach(e=>io?io.observe(e):ph(e))}
/* Questions */
function mkQ(c){const w=wOf(c),dq=w>0&&c.d&&Math.random()<.4,o=[c],seen=new Set([c.d]),ok=x=>x.id!=c.id&&x.n!=c.n;
 for(const x of shuf(CARDS.filter(x=>ok(x)&&x.c==c.c)).concat(shuf(CARDS.filter(x=>ok(x)&&wOf(x)==w&&x.c!=c.c)))){if(o.length>3)break;if(dq){if(!x.d||seen.has(x.d))continue;seen.add(x.d)}o.push(x)}
 return{c,o:shuf(o),dq:dq&&o.length>1}}
let Z=null;
function start(w,h){const L=CARDS.filter(c=>!S.own[c.id]&&(w<0||wOf(c)==w)&&(h<0||c.c==h));if(!L.length)return toast('Tout est déjà débloqué ici, bravo !');Z={w,h,qs:shuf(L).slice(0,10).map(mkQ),i:0,ok:0,a:null,x:null,un:[]};Q()}
function ans(k){if(!Z)return;const z=Z,q=z.qs[z.i];if(z.a!==null)return;clearTimeout(z.tm);z.a=k;S.q++;const w=k>=0&&q.o[k].id==q.c.id;if(w){z.ok++;S.ok++;S.own[q.c.id]=1;z.un.push(q.c.id);z.st=(z.st||0)+1;S.bs=Math.max(S.bs||0,z.st);S.coins+=5+(z.st>=3?2:0);boom()}else z.st=0;fx(w);save();Q()}
function hint(){const z=Z,q=z.qs[z.i];if(z.a!==null||z.x)return;if(S.coins<10)return toast('Pas assez de pièces');S.coins-=10;z.x=shuf(q.o.map((o,k)=>k).filter(k=>q.o[k].id!=q.c.id)).slice(0,2);save();Q()}
function nx(){const z=Z,n=z.qs.length;z.i++;z.a=null;z.x=null;if(z.i>=n){S.best=Math.max(S.best,z.ok);if(z.ok==n&&n>=5){S.coins+=20;const L=CARDS.filter(c=>!S.own[c.id]&&(z.w<0||wOf(c)==z.w));if(L.length){const b=L[Math.random()*L.length|0];S.own[b.id]=1;z.un.push(b.id)}}save()}Q()}
function endQ(){if(Z)clearTimeout(Z.tm);const e=$('qz');if(e)e.remove();Z=null;R()}
function Q(){let e=$('qz');if(!e){document.body.insertAdjacentHTML('beforeend','<div id="qz" class="ov q"></div>');e=$('qz')}const z=Z,n=z.qs.length;
 if(z.i>=n){const u=z.un.length;if(z.ok>=7&&!z.cf){z.cf=1;boom()}e.innerHTML=`<div class="qw"><button class="x" onclick="endQ()">✕</button><div class="cnt">Partie terminée</div><h1>${z.ok}/${n}</h1><p class="mu">${u} carte${u>1?'s':''} débloquée${u>1?'s':''}${z.ok==n&&n>=5?' · sans-faute 🎉 carte bonus + 20 🪙':''}</p><div class="gr sm">${z.un.map(i=>cd(CARDS[i],1,'')).join('')}</div><p style="margin-top:22px"><button class="btn" onclick="start(${z.w},${z.h})">Rejouer</button><button class="btn s" onclick="share()">📲 Partager</button><button class="btn s" onclick="endQ()">Terminer</button></p></div>`;ob();return}
 const q=z.qs[z.i],c=q.c,r=z.a!==null,win=r&&z.a>=0&&q.o[z.a].id==c.id;if(!r){if(z.ti!==z.i){z.ti=z.i;z.t0=Date.now();clearTimeout(z.tm);z.tm=setTimeout(()=>{if(Z===z&&z.a===null)ans(-1)},15000)}}
 e.innerHTML=`<div class="qw"><button class="x" onclick="endQ()">✕</button><div class="top"><span>Question ${z.i+1}/${n}</span><span>${z.st>=2?'🔥 x'+z.st+' · ':''}✅ ${z.ok} · 🪙 ${S.coins}</span></div>${bar(z.i+(r?1:0),n)}${r?'':`<div class="tm"><i style="animation-delay:-${((Date.now()-z.t0)/1000).toFixed(2)}s"></i></div>`}<div class="cnt">${H[c.c][0]}${!q.dq&&c.d?' · 📅 '+c.d:''}</div><h2 class="qt">${q.dq?`${c.e} ${c.n} : c’est quand ?`:`« ${c.t} »`}</h2><div class="opts">${q.o.map((o,k)=>{const cl=r?(o.id==c.id?'ok':z.a==k?'ko':'dim'):(z.x&&z.x.includes(k)?'dim':'');return`<button class="opt ${cl}" ${r||cl?'disabled':''} onclick="ans(${k})">${r&&!q.dq?o.e+' ':''}${q.dq?o.d:o.n}</button>`}).join('')}</div>${r?`<div class="rv">${win?`<div class="cnt ok-t">✨ Carte débloquée !</div>${cd(c,1,'')}`:`<p>${z.a===-1?'⏱️ Temps écoulé ! ':'Raté ! '}C’était <b>${c.n}</b>. Elle reviendra dans une prochaine partie.</p>`}<p class="mu">${c.t}${c.d?' · '+c.d:''}</p><button class="btn" onclick="nx()">${z.i+1>=n?'Résultat':'Suivant'} →</button></div>`:`<p style="margin-top:16px"><button class="btn s" onclick="hint()">💡 50/50 (10 🪙)</button></p>`}</div>`;ob()}
/* Pages */

const IC={home:'<path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-6h6v6"/>',play:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',cards:'<rect x="4" y="3" width="12" height="16" rx="2"/><path d="M8 21h10a2 2 0 0 0 2-2V7"/>',me:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'};

const wing=(i,body)=>`<div class="gl wing" style="--h:${W[i][2]}"><div class="wi">${W[i][1]}</div><div style="flex:1;min-width:0">${body}</div></div>`;
const VW={
home:()=>{const p=Math.round(pct()),nx=RK.find(x=>x[0]>pct());
 return`<h1>Mon musée</h1><p class="mu">Réponds juste aux questions pour débloquer les cartes. Objectif : remplir tout le musée !</p><div class="hero"><div class="ring" style="--p:${pct()}"><b>${p}%</b></div><div style="flex:1;min-width:200px"><small>TON RANG</small><h2>${rank()}</h2><p class="mu">${N()}/${CARDS.length} cartes débloquées${nx?` · prochain rang à ${nx[0]} %`:''}</p><button class="btn w" onclick="start(-1,-1)">Jouer maintenant</button></div></div><div class="tiles"><div class="gl"><b>${halls()}/${H.length}</b><span>Salles complètes</span></div><div class="gl"><b>🔥 ${S.bs||0}</b><span>Meilleure série</span></div><div class="gl"><b>${S.ok}</b><span>Bonnes réponses</span></div></div><div class="sec">Les ailes du musée</div>${W.map((w,i)=>{const a=cnt(c=>wOf(c)==i),b=tot(c=>wOf(c)==i);return wing(i,`<h3>${w[0]}</h3><p class="mu" style="margin-bottom:0">${a}/${b} cartes · ${H.filter(h=>h[1]==i).length} salles</p>${bar(a,b)}<button class="btn" onclick="start(${i},-1)">Jouer</button><button class="btn s" onclick="go('cards',{w:${i},h:-1,s:'all',n:60})">Visiter</button>`)}).join('')}`},

cards:()=>{const a=CARDS.filter(c=>(F.w<0||wOf(c)==F.w)&&(F.h<0||c.c==F.h)&&(F.s=='all'||(F.s=='own')==!!S.own[c.id])),n=a.length;
 return`<h1>Cartes</h1><div class="chips">${[[-1,'Toutes'],...W.map((w,i)=>[i,w[1]+' '+w[0]])].map(x=>`<button class="chip ${F.w==x[0]?'on':''}" onclick="go('cards',{w:${x[0]},h:-1,n:60})">${x[1]}</button>`).join('')}</div><div class="chips"><select onchange="go('cards',{h:+this.value,n:60})"><option value="-1">Toutes les salles</option>${H.map((h,k)=>F.w<0||h[1]==F.w?`<option value="${k}" ${F.h==k?'selected':''}>${h[0]}</option>`:'').join('')}</select>${[['all','Tout'],['own','Débloquées'],['no','À découvrir']].map(x=>`<button class="chip ${F.s==x[0]?'on':''}" onclick="go('cards',{s:'${x[0]}',n:60})">${x[1]}</button>`).join('')}</div><p class="mu">${n} carte${n>1?'s':''}</p><div class="gr">${a.slice(0,F.n).map(c=>cd(c,S.own[c.id],S.own[c.id]?`info(${c.id})`:'')).join('')}</div>${n>F.n?`<p style="text-align:center;margin-top:16px"><button class="btn s" onclick="go('cards',{n:F.n+60})">Afficher plus</button></p>`:''}`},
me:()=>`<h1>Profil</h1><div class="gl"><div class="st"><div><b>${N()}</b><span>Cartes</span></div><div><b>${S.ok}/${S.q}</b><span>Bonnes réponses</span></div><div><b>${S.best}/10</b><span>Meilleure partie</span></div><div><b>${S.coins} 🪙</b><span>Pièces</span></div></div></div><div class="gl" style="margin-top:14px"><b>Inviter tes amis</b><p class="mu">Envoie-leur le jeu et ton rang : qui remplira son musée le plus vite ?</p><button class="btn" onclick="share()">📲 Partager</button></div><div class="gl" style="margin-top:14px"><b>Sauvegarde</b><p class="mu">Ta progression est enregistrée sur cet appareil.</p><button class="btn s" onclick="exp()">⬇ Exporter</button><button class="btn s" onclick="$('im').click()">⬆ Importer</button><input type="file" id="im" accept=".json" hidden onchange="imp(this.files[0])"><button class="btn s" onclick="S.ph=S.ph?0:1;save();R()">Photos Wikipédia : ${S.ph?'oui':'non'}</button><button class="btn s" onclick="S.snd=S.snd?0:1;save();R()">Sons : ${S.snd?'oui':'non'}</button><button class="btn d" onclick="if(confirm('Tout effacer ?')){S=Object.assign({},DS,{own:{}});save();R()}">Réinitialiser</button></div><p class="mu" style="margin-top:16px;font-size:12px">Photos : Wikipédia / Wikimedia Commons (licences libres).</p>`};
function R(){$('hd').innerHTML=`<div class="brand"><div class="lg">C</div><div>Chrono<span>cards</span></div></div><div class="pills"><span class="pill">🪙 ${S.coins}</span><span class="pill">${N()}/${CARDS.length}</span></div>`;$('nv').innerHTML=NAV.map(n=>`<button class="${V==n[0]?'on':''}" onclick="go('${n[0]}')"><svg viewBox="0 0 24 24">${IC[n[0]]}</svg>${n[1]}</button>`).join('');$('app').innerHTML='<div class="view">'+VW[V]()+'</div>';ob()}
function share(){const t=`Je suis ${rank()} dans CHRONOCARDS : ${N()}/${CARDS.length} cartes débloquées. Fais mieux !`,u=location.href.split('#')[0];if(navigator.share)navigator.share({title:'CHRONOCARDS',text:t,url:u}).catch(()=>{});else try{navigator.clipboard.writeText(t+' '+u).then(()=>toast('Message copié !'))}catch(e){toast('Copie impossible')}}
